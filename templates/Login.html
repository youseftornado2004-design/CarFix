<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - CarFix</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f1f1f1;
            --input-bg: #2a2a2a;
            --border-color: #444;
            --accent-color: #007bff;
        }

        [data-theme="light"] {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --input-bg: #f9f9f9;
            --border-color: #ccc;
            --accent-color: #007bff;
        }

        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* الستارة الذكية للتنبيهات من أعلى */
        #alert-banner {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #dc3545;
            color: white;
            padding: 12px 25px;
            border-radius: 0 0 8px 8px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: top 0.4s ease-in-out;
            z-index: 1000;
        }
        #alert-banner.show {
            top: 0;
        }

        .box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            margin: 20px;
        }

        h2 { color: var(--accent-color); text-align: center; margin-bottom: 20px; }

        form { display: flex; flex-direction: column; gap: 15px; }

        label { font-size: 13px; font-weight: bold; }

        input {
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            font-size: 14px;
        }

        button[type="submit"] {
            background: #007bff;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 5px;
            transition: background 0.2s;
        }
        button[type="submit"]:hover { background: #0056b3; }

        .links-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            font-size: 14px;
        }

        .links-container a { color: #17a2b8; text-decoration: none; }
        .links-container a:hover { text-decoration: underline; }

        #theme-toggle {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 10px 15px;
            border-radius: 50px;
            border: none;
            background: var(--accent-color);
            color: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 1001;
        }
    </style>
</head>
<body data-theme="dark">

    <button id="theme-toggle" onclick="toggleTheme()">☀️ الوضع الفاتح</button>

    <!-- الستارة الذكية للتنبيه -->
    <div id="alert-banner">
        {% if error %}
            {{ error }}
        {% else %}
            برجاء ملء جميع الخانات المطلوبة!
        {% endif %}
    </div>

    <div class="box">
        <h2>تسجيل الدخول</h2>
        <form id="login-form" action="/login" method="POST" onsubmit="return validateForm(event)">
            
            <label>البريد الإلكتروني أو رقم الهاتف:</label>
            <input type="text" name="identifier" required oninput="hideAlert()">

            <label>كلمة المرور:</label>
            <input type="password" name="password" required oninput="hideAlert()">

            <button type="submit">دخول</button>
        </form>

        <div class="links-container">
            <a href="/register">ليس لديك حساب؟ إنشاء حساب جديد</a>
        </div>
    </div>

    <script>
        // لو جاي خطأ من البايثون، نزل الستارة فوراً
        window.onload = function() {
            {% if error %}
                showAlert("{{ error }}");
            {% endif %}
        };

        function showAlert(msg) {
            const banner = document.getElementById('alert-banner');
            banner.textContent = msg;
            banner.classList.add('show');
            setTimeout(() => {
                banner.classList.remove('show');
            }, 4000); // تختفي لوحدها بعد 4 ثوانٍ أو أول ما يكتب
        }

        function hideAlert() {
            const banner = document.getElementById('alert-banner');
            banner.classList.remove('show');
        }

        function validateForm(event) {
            const form = document.getElementById('login-form');
            const inputs = form.querySelectorAll('input');
            for (let input of inputs) {
                if (!input.value.trim()) {
                    event.preventDefault();
                    showAlert('برجاء ملء جميع الخانات الإجبارية قبل المتابعة!');
                    input.focus();
                    return false;
                }
            }
            return true;
        }

        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('theme-toggle');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                btn.textContent = '🌙 الوضع الليلي';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️ الوضع الفاتح';
            }
        }
    </script>
</body>
</html>
