<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والسيطرة - متجر قطع الغيار</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8f9fa; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container my-4">
    <h2 class="text-center mb-4">لوحة التحكم والسيطرة - إدارة المتجر</h2>

    <div class="row">
        <!-- قسم إضافة موديل سيارة -->
        <div class="col-md-6">
            <div class="card p-3">
                <h4 class="mb-3 text-primary">إضافة موديل سيارة وسنة صنع جديدة</h4>
                <form action="/add_car" method="POST">
                    <div class="mb-3">
                        <label class="form-label">اسم / موديل السيارة:</label>
                        <input type="text" name="car_name" class="form-control" placeholder="مثال: تويوتا كورولا" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">سنة الصنع المتاحة:</label>
                        <input type="text" name="car_year" class="form-control" placeholder="مثال: 2024" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">حفظ وإضافة السيارة للداتابيز</button>
                </form>
            </div>
        </div>

        <!-- قسم إضافة قطعة غيار جديدة -->
        <div class="col-md-6">
            <div class="card p-3">
                <h4 class="mb-3 text-success">إضافة قطعة غيار جديدة للمتجر</h4>
                <form action="/add_product" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">اسم القطعة:</label>
                        <input type="text" name="product_name" class="form-control" placeholder="مثال: تيل فرامل أمامي" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">السعر (ج.م):</label>
                            <input type="number" step="0.01" name="price" class="form-control" placeholder="مثال: 1200" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">الكمية بالمخزون (Stock):</label>
                            <input type="number" name="stock" class="form-control" placeholder="10" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">صورة قطعة الغيار:</label>
                        <input type="file" name="image" class="form-control" accept="image/*" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">وصف القطعة:</label>
                        <textarea name="description" class="form-control" rows="2" placeholder="وصف تفصيلي واستخدامات قطعة الغيار..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100">حفظ ونشر قطعة الغيار</button>
                </form>
            </div>
        </div>
    </div>

    <!-- قسم إضافة زيت محرك جديد (الجديد كلياً) -->
    <div class="row">
        <div class="col-12">
            <div class="card p-4 border-warning">
                <h4 class="mb-3 text-warning">🛢️ إضافة زيت محرك أو مضخة جديد للمتجر</h4>
                <form action="/add_oil" method="POST" enctype="multipart/form-data">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">اسم الزيت:</label>
                            <input type="text" name="product_name" class="form-control" placeholder="مثال: زيت توتال 5W40" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">السعر (ج.م):</label>
                            <input type="number" step="0.01" name="price" class="form-control" placeholder="مثال: 450" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">موديل السيارة المتوافق:</label>
                            <input type="text" name="car_model" class="form-control" placeholder="مثال: شيفروليه كروز">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">صورة الزيت:</label>
                        <input type="file" name="image" class="form-control" accept="image/*" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">وصف الزيت:</label>
                        <textarea name="description" class="form-control" rows="2" placeholder="تفاصيل ولزوجة الزيت والمواصفات..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 text-dark fw-bold">حفظ وإضافة الزيت لقسم الزيوت</button>
                </form>
            </div>
        </div>
    </div>

    <!-- روابط سريعة للرجوع -->
    <div class="text-center mt-3">
        <a href="/oils" target="_blank" class="btn btn-outline-dark me-2">عرض صفحة الزيوت 🛢️</a>
        <a href="/" class="btn btn-outline-secondary">الذهاب للموقع الرئيسي 🚗</a>
    </div>

</div>

</body>
</html>
