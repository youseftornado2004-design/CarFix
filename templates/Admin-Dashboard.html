<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن - CarFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f4f6f9; }
        .sidebar { background: #1e293b; color: white; min-height: 100vh; padding: 20px; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- القائمة الجانبية -->
        <div class="col-md-3 sidebar">
            <h3>CarFix Admin</h3>
            <hr>
            <ul class="nav flex-column">
                <li class="nav-item mb-2"><a href="#" class="nav-link text-white">إدارة المنتجات</a></li>
                <li class="nav-item mb-2"><a href="/oils" target="_blank" class="nav-link text-white">عرض صفحة الزيوت 🛢️</a></li>
                <li class="nav-item mb-2"><a href="/" class="nav-link text-white">الذهاب للموقع الرئيسي</a></li>
            </ul>
        </div>

        <!-- المحتوى الرئيسي -->
        <div class="col-md-9 p-4">
            <h2 class="mb-4">لوحة التحكم الإدارية</h2>

            <!-- نموذج إضافة زيت جديد (واقعي واحترافي) -->
            <div class="card">
                <div class="card-header bg-primary text-white font-weight-bold">إضافة زيت محرك جديد للمتجر 🛢️</div>
                <div class="card-body">
                    <form action="/add_oil" method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">اسم الزيت</label>
                            <input type="text" name="product_name" class="form-control" required placeholder="مثال: زيت توتال 5W40">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">وصف الزيت</label>
                            <textarea name="description" class="form-control" rows="2" placeholder="تفاصيل المنتج والمواصفات..."></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">السعر (ج.م)</label>
                                <input type="number" step="0.01" name="price" class="form-control" required placeholder="0.00">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">موديل السيارة المتوافق</label>
                                <input type="text" name="car_model" class="form-control" placeholder="مثال: شيفروليه كروز">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">صورة الزيت</label>
                            <input type="file" name="image" class="form-control" accept="image/*" required>
                        </div>
                        <button type="submit" class="btn btn-success">حفظ ونشر الزيت</button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
