<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - CarFix</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f1f1f1;
            --input-bg: #2a2a2a;
            --border-color: #444;
            --accent-color: #007bff;
        }

        [data-theme="light"] {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --input-bg: #f9f9f9;
            --border-color: #ccc;
            --accent-color: #007bff;
        }

        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* الستارة الذكية للتنبيهات من أعلى */
        #alert-banner {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #dc3545;
            color: white;
            padding: 12px 25px;
            border-radius: 0 0 8px 8px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: top 0.4s ease-in-out;
            z-index: 1000;
        }
        #alert-banner.show {
            top: 0;
        }

        .box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            margin: 20px;
        }

        h2 { color: var(--accent-color); text-align: center; margin-bottom: 20px; }

        form { display: flex; flex-direction: column; gap: 12px; }

        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; display: flex; flex-direction: column; gap: 5px; }

        label { font-size: 13px; font-weight: bold; }

        input, select {
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            font-size: 14px;
        }

        .date-selects { display: flex; gap: 5px; }
        .date-selects select { flex: 1; }

        button[type="submit"] {
            background: #28a745;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button[type="submit"]:hover { background: #218838; }

        .login-link { color: #17a2b8; text-decoration: none; text-align: center; display: block; margin-top: 15px; font-size: 14px; }
        .login-link:hover { text-decoration: underline; }
        
        #theme-toggle {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 10px 15px;
            border-radius: 50px;
            border: none;
            background: var(--accent-color);
            color: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 1001;
        }
    </style>
</head>
<body data-theme="dark">

    <button id="theme-toggle" onclick="toggleTheme()">☀️ الوضع الفاتح</button>

    <!-- الستارة الذكية للتنبيه -->
    <div id="alert-banner">
        {% if error %}
            {{ error }}
        {% else %}
            برجاء ملء جميع الخانات الإجبارية بشكل صحيح!
        {% endif %}
    </div>

    <div class="box">
        <h2>انشاء حساب جديد</h2>
        <form id="reg-form" action="/register" method="POST" onsubmit="return validateForm(event)">
            
            <div class="row">
                <div>
                    <label>الاسم الأول:</label>
                    <input type="text" name="first_name" required oninput="hideAlert()">
                </div>
                <div>
                    <label>اسم العيلة:</label>
                    <input type="text" name="last_name" required oninput="hideAlert()">
                </div>
            </div>

            <label>البريد الإلكتروني:</label>
            <input type="email" name="email" required oninput="hideAlert()">

            <label>كلمة المرور:</label>
            <input type="password" name="password" required oninput="hideAlert()">

            <label>رقم الهاتف:</label>
            <input type="text" name="phone" required oninput="hideAlert()">

            <label>تاريخ الميلاد:</label>
            <div class="date-selects">
                <select name="birth_day" id="day-select" required onchange="hideAlert()">
                    <option value="" disabled selected>اليوم</option>
                </select>
                <select name="birth_month" id="month-select" required onchange="hideAlert()">
                    <option value="" disabled selected>الشهر</option>
                    <option value="يناير">يناير</option>
                    <option value="فبراير">فبراير</option>
                    <option value="مارس">مارس</option>
                    <option value="أبريل">أبريل</option>
                    <option value="مايو">مايو</option>
                    <option value="يونيو">يونيو</option>
                    <option value="يوليو">يوليو</option>
                    <option value="أغسطس">أغسطس</option>
                    <option value="سبتمبر">سبتمبر</option>
                    <option value="أكتوبر">أكتوبر</option>
                    <option value="نوفمبر">نوفمبر</option>
                    <option value="ديسمبر">ديسمبر</option>
                </select>
                <select name="birth_year" id="year-select" required onchange="hideAlert()">
                    <option value="" disabled selected>السنة</option>
                </select>
            </div>

            <label>الجنس:</label>
            <select name="gender" required onchange="hideAlert()">
                <option value="" disabled selected>اختر الجنس</option>
                <option value="ذكر">ذكر</option>
                <option value="أنثى">أنثى</option>
            </select>

            <button type="submit">تسجيل الحساب</button>
        </form>
        
        <!-- الرابط المعدل لصفحة تسجيل الدخول -->
        <a href="/login" class="login-link">لديك حساب بالفعل؟ سجل دخولك هنا</a>
    </div>

    <script>
        // عرض الستارة لو فيه خطأ جاي من الـ backend (زي إيميل مسجل مسبقاً)
        window.onload = function() {
            {% if error %}
                showAlert("{{ error }}");
            {% endif %}
        };

        // تعبئة أيام الشهر من 1 إلى 31
        const daySelect = document.getElementById('day-select');
        for (let i = 1; i <= 31; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.textContent = i;
            daySelect.appendChild(opt);
        }

        // تعبئة سنوات الميلاد من 2026 لحد 1900
        const yearSelect = document.getElementById('year-select');
        for (let y = 2026; y >= 1900; y--) {
            let opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y;
            yearSelect.appendChild(opt);
        }

        // إظهار الستارة الذكية للتنبيه
        function showAlert(msg) {
            const banner = document.getElementById('alert-banner');
            banner.textContent = msg;
            banner.classList.add('show');
        }

        // إخفاء الستارة أول ما المستخدم يبدأ يكتب أو يعدل
        function hideAlert() {
            const banner = document.getElementById('alert-banner');
            banner.classList.remove('show');
        }

        // التحقق قبل الإرسال
        function validateForm(event) {
            const form = document.getElementById('reg-form');
            const inputs = form.querySelectorAll('input, select');
            for (let input of inputs) {
                if (!input.value.trim()) {
                    event.preventDefault();
                    showAlert('برجاء ملء جميع الخانات الإجبارية قبل المتابعة!');
                    input.focus();
                    return false;
                }
            }
            return true;
        }

        // تبديل الوضع الليلي والفاتح
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('theme-toggle');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                btn.textContent = '🌙 الوضع الليلي';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️ الوضع الفاتح';
            }
        }
    </script>
</body>
</html>
