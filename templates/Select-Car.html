<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختر سيارتك - CarFix</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f1f1f1;
            --accent-color: #007bff;
        }

        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: var(--accent-color);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: right;
        }

        label {
            font-weight: bold;
            font-size: 15px;
        }

        select {
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 15px;
            background-color: #2a2a2a;
            color: white;
        }

        button[type="submit"] {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #218838;
        }

        .admin-link {
            margin-top: 20px;
            display: block;
            color: #17a2b8;
            text-decoration: none;
            font-size: 14px;
        }

        .admin-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>اختر سيارتك وسنة الصنع</h2>
        
        <form action="/add_car" method="POST">
            <label for="car-select">اختر الموديل والسنة:</label>
            <select name="car_model" id="car-select" required>
                <option value="" disabled selected>-- اختر السيارة المتاحة --</option>
                {% if cars %}
                    {% for car in cars %}
                        <option value="{{ car.car_model }}" data-year="{{ car.car_year }}">
                            {{ car.car_model }} - سنة {{ car.car_year }}
                        </option>
                    {% endfor %}
                {% else %}
                    <option value="" disabled>لا توجد سيارات مضافة حالياً من لوحة الأدمن</option>
                {% endif %}
            </select>

            <!-- حقل مخفي يرسل السنة بوضوح للسيرفر والسيشن -->
            <input type="hidden" name="car_year" id="car-year-hidden" value="">
            
            <button type="submit">انتقال لعرض قطع الغيار والزيوت</button>
        </form>

        <a href="/admin" class="admin-link">الانتقال إلى لوحة تحكم الأدمن</a>
    </div>

    <script>
        // كود بسيط لربط سنة الصنع بالحقل المخفي أوتوماتيكياً عند اختيار السيارة
        const selectElement = document.getElementById('car-select');
        const yearHiddenInput = document.getElementById('car-year-hidden');

        selectElement.addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            const carYear = selectedOption.getAttribute('data-year');
            yearHiddenInput.value = carYear || '';
        });
    </script>
</body>
</html>
